[project]
name = "autoconst-revit-mcp"
version = "0.2.0"
description = "AutoConst Revit MCP - AI tools for Revit BIM, QS and estimating workflows, via pyRevit Routes"
readme = "README.md"
license = "MIT AND LicenseRef-AutoConst-Source-Available"
license-files = ["LICENSE", "LICENSE-AUTOCONST", "NOTICE"]
authors = [{ name = "Hamza Jabbar" }, { name = "Talal Ahmed" }, { name = "Juan Rodriguez" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # mcp 1.10+ fails to load the tools (see #13), and mcp 1.9.x breaks on
    # pydantic 2.14+. Raise both caps together when #13 upgrades the SDK.
    "mcp[cli]>=1.9.0,<1.10",
    "pydantic>=2.11,<2.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
