[project]
name = "autoconst-revit-mcp"
version = "0.2.0"
description = "AutoConst Revit MCP - AI tools for Revit BIM, QS and estimating workflows, via pyRevit Routes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Talal Ahmed" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.9.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
